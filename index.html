<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>PCS AI</title>
<style>
:root{--navy:#0b2545;--blue:#1d6fd8;--bg:#f2f5f9;--card:#fff;--fg:#14202e;--line:#d9e1ea}
@media (prefers-color-scheme:dark){:root{--bg:#0a111b;--card:#142033;--fg:#e8eef6;--line:#24344a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0)) 16px 12px}
header b{font-size:18px;letter-spacing:.5px}
header small{display:block;opacity:.75;font-size:12px;margin-top:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.45;font-size:15px}
.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m img{max-width:100%;border-radius:8px;display:block;margin-bottom:6px}
#prev{display:none;padding:8px 16px 0}
#prev span{display:inline-flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px}
#prev img{height:36px;border-radius:6px}
#prev button{background:none;border:0;color:var(--fg);font-size:16px}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center;background:var(--bg)}
.plus{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--blue);font-size:26px;line-height:1;cursor:pointer}
input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:11px 16px;background:var(--card);color:var(--fg);font:inherit}
#send{background:var(--navy);color:#fff;border:0;border-radius:22px;height:42px;padding:0 18px;font:inherit;cursor:pointer}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header><b>PCS AI</b><small>Développé par Abdoul PCS</small></header>
<div id="log"><div class="m a">Bonjour, je suis PCS AI. Comment puis-je vous aider ?</div></div>
<div id="prev"></div>
<div class="bar">
<button class="plus" id="plus" aria-label="Ajouter une image">+</button>
<input type="file" id="file" accept="image/*" hidden>
<input type="text" id="in" placeholder="Écrivez votre message…" autocomplete="off">
<button id="send">Envoyer</button>
</div>
<script>
const $=id=>document.getElementById(id),log=$('log'),inp=$('in'),btn=$('send'),prev=$('prev');
const hist=[];let img=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
$('plus').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',.8);img={data:url.split(',')[1],url};
  prev.style.display='block';prev.innerHTML='<span><img src="'+url+'"> Image ajoutée <button id="x">✕</button></span>';
  $('x').onclick=clr};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
function clr(){img=null;prev.style.display='none';prev.innerHTML=''}
function add(t,c,u){const d=document.createElement('div');d.className='m '+c;
 if(u){const i=document.createElement('img');i.src=u;d.appendChild(i)}
 d.appendChild(document.createTextNode(t));log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function go(){
 const t=inp.value.trim();if(!t&&!img)return;
 add(t,'u',img&&img.url);
 hist.push({role:'user',text:t,image:img&&img.data,mime:'image/jpeg'});
 inp.value='';clr();btn.disabled=true;
 const b=add('…','a');
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:hist.map((h,i)=>i<hist.length-1?{role:h.role,text:h.text}:h)})});
  const d=await r.json();b.textContent=d.text;hist.push({role:'assistant',text:d.text});
 }catch(e){b.textContent='Connexion impossible. Réessayez.';hist.pop()}
 btn.disabled=false;inp.focus();
}
btn.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
